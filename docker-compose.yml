services:
  postgres:
    image: postgres:16-alpine
    container_name: mcp-telegram-db
    environment:
      POSTGRES_USER: ${DB_USER:-mcp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mcp_secret}
      POSTGRES_DB: ${DB_NAME:-mcp_telegram}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mcp} -d ${DB_NAME:-mcp_telegram}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-telegram-daemon
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-mcp}:${DB_PASSWORD:-mcp_secret}@postgres:5432/${DB_NAME:-mcp_telegram}
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - DAEMON_HOST=0.0.0.0
      - DAEMON_PORT=${DAEMON_PORT:-8765}
      - UPLOAD_DIR=/app/uploads
    ports:
      - "127.0.0.1:${DAEMON_PORT:-8765}:8765"
    volumes:
      - telegram_downloads:/app/downloads
      - ${TG_UPLOAD_DIR:-/tmp}:/app/uploads:ro
    restart: unless-stopped
    command: ["mcp-telegram", "daemon"]

  # MCP server (HTTP transport for Dify and other HTTP-based MCP clients).
  # Exposes SSE (default) or streamable-http. Set MCP_AUTH_TOKEN before
  # exposing publicly — anyone with the token can act on your Telegram account.
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-telegram-mcp
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      - DAEMON_URL=http://daemon:8765
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - MCP_HOST=${MCP_HOST:-0.0.0.0}
      - MCP_PORT=${MCP_PORT:-8766}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-}
      - MCP_DISABLE_HOST_VALIDATION=${MCP_DISABLE_HOST_VALIDATION:-false}
    ports:
      # Loopback by default — front it with your own reverse proxy (TLS) for
      # public exposure. Change MCP_HOST/ports to widen.
      - "127.0.0.1:${MCP_PORT:-8766}:${MCP_PORT:-8766}"
    restart: unless-stopped
    command: ["mcp-telegram", "start", "--daemon"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null -w '%{http_code}' -m 2 http://localhost:${MCP_PORT:-8766}/sse | grep -qE '200|401'",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  telegram_downloads:

networks:
  default:
    name: mcp-telegram-network
